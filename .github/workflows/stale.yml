name: Stale

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark Stale
    uses: sebastienrousseau/pipelines/.github/workflows/stale.yml@980375f1d96368885ff65cc4c7f1ff355a5a4095
    with:
      days-before-stale: 60
      days-before-close: 14
      exempt-issue-labels: 'pinned,security,bug'
      exempt-pr-labels: 'pinned,security'
