name: Container Security

# Static Dockerfile lint (hadolint) on every PR that touches the
# Dockerfile, plus a Trivy CVE scan of the published multi-arch OCI
# image after each successful goreleaser run. Findings are advisory
# on the first pass — we upload them as GitHub Code Scanning results
# so they surface in the Security tab, but the workflow does not
# block merges. Once we've reviewed a few runs and understand the
# noise floor, the hadolint job can be flipped to `continue-on-error:
# false` and the trivy job's severity threshold can be tightened.

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.goreleaser.yaml'
      - '.github/workflows/container-scan.yml'
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Published image version without the leading v (for example 0.0.13)'
        required: true
        type: string

permissions: {}

jobs:
  hadolint:
    name: hadolint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Run hadolint on the Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          # SARIF output feeds the GitHub Code Scanning surface below,
          # so findings appear alongside CodeQL / gosec / Scorecard
          # alerts.
          format: sarif
          output-file: hadolint.sarif
          # DL3018 = "always pin apk add versions" — we do pin the
          # base image digest itself, which upstream considers
          # sufficient hardening. Disable this specific rule so the
          # workflow doesn't nag on every PR while adopting a full
          # per-package pin policy would double the maintenance
          # burden without meaningfully improving supply-chain risk.
          ignore: DL3018

      - name: Upload hadolint SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: hadolint.sarif
          category: hadolint

  trivy-image:
    name: Trivy image scan
    # Only run after a release publishes a fresh image tag to ghcr.io
    # (or on manual dispatch). Skips PR/main triggers because there is
    # no image tag to scan yet at those points.
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve immutable release tag
        id: image
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG:-${MANUAL_VERSION}}"
          version="${version#v}"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          echo "tag=${version}" >> "${GITHUB_OUTPUT}"

      - name: Run Trivy on the published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'ghcr.io/sebastienrousseau/corralctl:${{ steps.image.outputs.tag }}'
          format: 'sarif'
          output: 'trivy.sarif'
          # Only flag high and critical for now — anything below
          # tends to be noise on a minimal Alpine base and adds
          # nothing goreleaser can act on.
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy.sarif
          category: trivy-image
