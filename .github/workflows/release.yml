name: Release

on:
  push:
    tags:
      - 'v*'
  # Dry-run mode. Release machinery is the code least exercised before it
  # matters most: a tag push is a one-shot, and a config error there means a
  # broken or half-published release. This builds every artefact, runs every
  # before-hook and packages every format, then stops short of publishing,
  # signing and attesting — so new machinery can be proven before its first
  # real use. Artefacts are uploaded for inspection.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and package without publishing"
        type: boolean
        default: true

permissions: {}

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    env:
      # true for a manual dry run, false for a tag push.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    permissions:
      contents: write
      id-token: write
      attestations: write
      # Required so goreleaser can push the Docker image to
      # ghcr.io/sebastienrousseau/corralctl for the MCP registry entry.
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'

      # Guards a real publish: the ref must be a semver tag, that tag must
      # point at this commit, and the commit must be on main.
      #
      # Skipped on a dry run, which has no tag at all — GITHUB_REF_NAME is
      # the branch it was dispatched from, so every assertion here fails on
      # a ref the step was never meant to see. Nothing is published on a
      # dry run, so there is nothing for it to protect.
      - name: Verify release ref
        if: env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
          test "$(git rev-list -n 1 "${GITHUB_REF_NAME}")" = "${GITHUB_SHA}"

      - name: Test release source
        run: go test ./...

      # Docker toolchain for the goreleaser dockers: + docker_manifests:
      # sections. QEMU handles arm64 emulation on the amd64 runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Keyless cosign signing uses the same OIDC token our provenance
      # attestations do, so there is no long-lived signing key to leak.
      # goreleaser's docker_signs: block below invokes the installed
      # cosign binary; this step just makes it available on PATH.
      # syft, for the goreleaser `sboms:` block. goreleaser shells out to the
      # syft binary and it is not preinstalled on GitHub runners, so without
      # this the release fails at the SBOM stage with
      # `exec: "syft": executable file not found in $PATH` — after building
      # every archive and package, but before publishing anything.
      # Pinned by commit SHA to match how every other action here is pinned.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          # A dry run builds and packages everything, then stops: --snapshot
          # skips the publish, sign and announce pipes and does not need a tag.
          args: ${{ env.DRY_RUN == 'true' && 'release --clean --snapshot --skip=publish,sign,announce' || 'release --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          AUR_KEY: ${{ secrets.AUR_KEY }}

      # The cask goreleaser generated, handed to the `brew` job below.
      #
      # Passed as an artifact rather than regenerated there so the published
      # cask is byte-for-byte what goreleaser produced from the release's own
      # checksums. Regenerating it from a template in a script would be one
      # more copy of a generated file, free to drift the moment goreleaser
      # changes its output — which is the failure this project keeps meeting.
      - name: Carry the cask to the publishing job
        if: env.DRY_RUN != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-cask
          path: dist/homebrew/Casks/corralctl.rb
          if-no-files-found: error
          retention-days: 1

      # SLSA build provenance for every artifact goreleaser emitted:
      # tarballs, .deb, .rpm, checksums.txt. The subject-checksums file
      # is generated by goreleaser at dist/checksums.txt; passing it
      # to actions/attest-build-provenance is the fastest way to attest
      # a batch of files in one shot without listing each name here.
      # Users verify with `gh attestation verify <file> --owner sebastienrousseau`.
      #
      # The Docker image published by goreleaser is signed separately via the
      # docker_signs: block in .goreleaser.yaml, which invokes the cosign binary
      # installed above.
      #
      # Note on Scorecard: neither of those feeds the Signed-Releases check, and
      # this comment used to claim they did. That check looks for signature files
      # among the release *assets*; provenance lives in GitHub's attestation store
      # and the image signatures are not release assets. The signs: block added to
      # .goreleaser.yaml emits checksums.txt.sig and .pem as assets, which is what
      # the check reads.
      - name: Attest release artifacts
        id: attest
        if: env.DRY_RUN != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      # Attach the provenance bundle to the release itself.
      #
      # The attestation above already lives in GitHub's attestation store,
      # which is where `gh attestation verify` looks. But that store is not
      # the release, and anyone auditing the download page — or any tool
      # reading release assets, OpenSSF Scorecard's Signed-Releases check
      # among them — sees signatures with no provenance beside them.
      # Publishing the bundle as an asset costs one command and makes the
      # build's provenance verifiable by whoever has the tarball, without
      # them having to know the attestation API exists.
      #
      # The .intoto.jsonl name is the ecosystem convention for in-toto
      # provenance and is what tooling looks for; the file is the Sigstore
      # bundle the step above produced, unmodified.
      - name: Publish provenance alongside the release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          if [ -z "${BUNDLE}" ] || [ ! -f "${BUNDLE}" ]; then
            echo "::error::attestation step produced no bundle at '${BUNDLE}'"
            exit 1
          fi
          cp "${BUNDLE}" "${RUNNER_TEMP}/checksums.txt.intoto.jsonl"
          gh release upload "${GITHUB_REF_NAME}" \
            "${RUNNER_TEMP}/checksums.txt.intoto.jsonl" --clobber

  registry:
    name: Publish to the MCP registry
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Out of the release job, for the reason the cask was moved out in
    # v0.0.34 and learned again in v0.0.35: this ran inside it, the registry
    # rejected server.json with `422 expected length <= 100`, and that took
    # the AUR and Homebrew jobs with it — both carry `needs: release`, so a
    # validation error in a third publisher skipped two unrelated ones while
    # the artefacts and their provenance were already out.
    #
    # A registry that will not accept a description is not a reason to
    # withhold a package from Arch and Homebrew users.
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Publish the MCP registry entry.
      #
      # Without this step server.json was a file nobody read: the registry sat at
      # 0.0.13 from 2026-07-01 while the repo moved through five releases, so the
      # published entry advertised a stale OCI image tag. Bumping the file was
      # never sufficient — nothing shipped it.
      # mcp-publisher is distributed as prebuilt release binaries, not as an
      # installable Go package: `go install .../cmd/mcp-publisher@v1.8.1` fails
      # with "module found, but does not contain package". Download the pinned
      # release asset instead, and verify its Sigstore bundle before running it —
      # this binary publishes on the repository's behalf, so it is exactly the
      # kind of tool that should not be executed unverified. Upstream publishes a
      # .sigstore.json per artifact, so verification costs one command.
      - name: Install mcp-publisher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MCP_PUBLISHER_VERSION: v1.8.1
        run: |
          set -euo pipefail
          asset="mcp-publisher_linux_amd64.tar.gz"
          gh release download "${MCP_PUBLISHER_VERSION}" \
            --repo modelcontextprotocol/registry \
            --pattern "${asset}" --pattern "${asset}.sigstore.json" \
            --dir "${RUNNER_TEMP}"
          cosign verify-blob \
            --bundle "${RUNNER_TEMP}/${asset}.sigstore.json" \
            --certificate-identity-regexp 'https://github.com/modelcontextprotocol/registry/.*' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${RUNNER_TEMP}/${asset}"
          mkdir -p "${RUNNER_TEMP}/mcp-publisher-bin"
          tar -xzf "${RUNNER_TEMP}/${asset}" -C "${RUNNER_TEMP}/mcp-publisher-bin"
          echo "${RUNNER_TEMP}/mcp-publisher-bin" >> "${GITHUB_PATH}"

      - name: Publish to the MCP registry
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # Fail loudly if server.json was not bumped with the release, rather
          # than silently publishing a mismatched entry.
          declared="$(python3 -c 'import json;print(json.load(open("server.json"))["version"])')"
          if [[ "${declared}" != "${version}" ]]; then
            echo "::error::server.json declares ${declared} but the tag is ${version}" >&2
            exit 1
          fi
          # No token gate. `mcp-publisher login github-oidc` authenticates with
          # the GitHub Actions OIDC token, which this job already has via
          # `id-token: write` — it needs no MCP_REGISTRY_TOKEN secret. Gating on
          # that secret meant the step reported success while publishing
          # nothing, which is why the registry sat at 0.0.13 through v0.0.21
          # even after the publisher itself was fixed.
          mcp-publisher login github-oidc
          mcp-publisher publish

  # AUR is published in its own job, after the release has succeeded.
  #
  # It is deliberately not part of the release job: aur.archlinux.org
  # being unreachable for an hour must not cost a release its artefacts,
  # its signatures or its attestations. goreleaser's aur pipe therefore
  # runs with skip_upload, and the push happens here.
  #
  # The previous arrangement stopped at "generated in dist for manual
  # publishing", and manual publishing happened exactly once: the AUR
  # package sat at 0.0.13 while the project shipped 0.0.32. A step nobody
  # is scheduled to run is a step that does not happen.
  #
  # continue-on-error keeps the original guarantee — this cannot fail the
  # release — while making the attempt automatic. A failure is visible on
  # the run rather than silent.
  brew:
    name: Publish the Homebrew cask
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Same guarantee as the AUR job below, and for the same reason — learned
    # the hard way in v0.0.33, when this ran inside goreleaser instead. The
    # tap protects `main` with enforce_admins, so the direct commit added in
    # v0.0.33 returned `409 Changes must be made through a pull request` and
    # took the release down with it: the artefacts were already published,
    # but their SLSA provenance and the MCP registry entry never were.
    #
    # A package host is not allowed to cost a release its provenance.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Fetch the generated cask
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: homebrew-cask
          path: cask

      - name: Open and merge the tap pull request
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN}" ]]; then
            # Loud, not quiet. Reporting success without publishing is how
            # the tap reached v0.0.25 and the AUR package 0.0.13.
            echo "::error::HOMEBREW_TAP_TOKEN is not set; the cask will not be updated" >&2
            exit 1
          fi

          test -s cask/corralctl.rb
          grep -q 'cask "corralctl"' cask/corralctl.rb

          tap="sebastienrousseau/homebrew-tap"
          branch="corralctl-${VERSION}"

          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${tap}.git" tap
          cd tap
          git config user.name "goreleaserbot"
          git config user.email "bot@goreleaser.com"

          mkdir -p Casks
          cp ../cask/corralctl.rb Casks/corralctl.rb

          if git diff --quiet -- Casks/corralctl.rb; then
            echo "cask already matches ${VERSION}; nothing to publish"
            exit 0
          fi

          git switch -c "${branch}"
          git add Casks/corralctl.rb
          git commit -m "corralctl ${VERSION}"
          git push origin "${branch}"

          # A pull request because the tap requires one — enforce_admins is
          # on, so no token can push to main. It needs no review (0 required
          # approvals) and no status checks, so it is merged straight away
          # rather than left for a human, which is what let seven of them
          # pile up while the tap served v0.0.25.
          #
          # `--auto` is deliberately not used: the tap has auto-merge
          # disabled, and --auto fails outright when it is.
          gh pr create --repo "${tap}" --head "${branch}" --base main \
            --title "corralctl ${VERSION}" \
            --body "Generated by goreleaser from the checksums of the signed ${VERSION} release."
          gh pr merge --repo "${tap}" "${branch}" --squash --delete-branch

          echo "==> confirming the tap is on ${VERSION}"
          sleep 5
          published="$(gh api "repos/${tap}/contents/Casks/corralctl.rb" \
            --jq '.content' | base64 -d | grep -m1 -oE 'version "[^"]+"')"
          echo "    tap now says: ${published}"
          case "${published}" in
            *"${VERSION#v}"*) echo "    matches ${VERSION}" ;;
            *) echo "::error::tap still reports ${published} after merging" >&2; exit 1 ;;
          esac

  aur:
    name: Publish to the AUR
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Publish
        env:
          AUR_KEY: ${{ secrets.AUR_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${AUR_KEY}" ]]; then
            # Said out loud rather than skipped quietly. A missing key is
            # a configuration problem somebody has to fix, and reporting
            # success without publishing is how the registry entry and
            # this package both went stale for twenty releases.
            echo "::warning::AUR_KEY is not set; the AUR package will not be updated" >&2
            exit 1
          fi
          bash scripts/publish_aur.sh "${GITHUB_REF_NAME#v}"
