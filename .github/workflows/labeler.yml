name: PR Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Label PR
    uses: sebastienrousseau/pipelines/.github/workflows/labeler.yml@980375f1d96368885ff65cc4c7f1ff355a5a4095
    with:
      config-path: '.github/labeler.yml'
