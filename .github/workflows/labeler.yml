name: PR Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Label PR
    uses: sebastienrousseau/pipelines/.github/workflows/labeler.yml@3f9978aba68e59da1bd5a58d12fbaf142679fe5f
    with:
      config-path: '.github/labeler.yml'
