name: PR Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Label PR
    uses: sebastienrousseau/pipelines/.github/workflows/labeler.yml@83114142d0a14e9c6302a9ba9e716a0cc53e4e01
    with:
      config-path: '.github/labeler.yml'
