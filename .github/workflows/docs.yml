name: Deploy Docs

# Native GitHub Pages publishing via the official actions, replacing the
# earlier peaceiris/actions-gh-pages approach. The site is served at
# https://doc.corrallib.com (custom domain configured by the CNAME file
# below + a doc → sebastienrousseau.github.io DNS record).
#
# Requires repository Settings → Pages → Source = "GitHub Actions" (not
# "Deploy from a branch"). The legacy gh-pages branch can be deleted
# once this workflow has run successfully at least once.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required permissions for actions/deploy-pages:
#   pages: write  — to publish the artifact to the Pages environment
#   id-token: write — OIDC token used by deploy-pages to authenticate
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deploy at a time; cancel any in-flight run when a
# newer push lands so the deployed version always tracks main.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'

      # The site is built by ssg through the Lucid theme vendored at
      # docs-site/_layouts. The version is pinned in a file rather than here
      # so a bump is one line and shows up in a diff as a version change.
      - name: Resolve the generator version
        id: ssg_version
        run: |
          version="$(tr -d '[:space:]' < .github/ssg-version)"
          if [[ -z "${version}" ]]; then
            echo "::error::no generator version in .github/ssg-version"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "building against ssg ${version}"

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@75b4bfae1b2c753a6806bbce6e6cb89b602de33c # v1.22.0

      - name: Install ssg
        run: |
          cargo binstall --no-confirm "ssg@${SSG_VERSION}"
          ssg --version
        env:
          SSG_VERSION: ${{ steps.ssg_version.outputs.version }}

      # Generates the reference, builds through the theme, copies the theme's
      # assets, gives headings ids and fails on a dangling fragment, and
      # stamps the CNAME last because ssg writes an empty one.
      - name: Build the documentation site
        run: bash scripts/build-docs.sh

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
