name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  go:
    name: Go CI
    permissions:
      contents: read
    uses: sebastienrousseau/pipelines/.github/workflows/go-ci.yml@7061363af0a1da9d60c5901bd2874ac83ff7e34e
    with:
      go-version: '1.26.6'
      run-cross-platform: true
      run-coverage: true
    # Passed explicitly, not `secrets: inherit`.
    #
    # go-ci.yml declares CODECOV_TOKEN in its workflow_call contract, and a
    # declared secret is not inherited — the caller has to hand it over. This
    # job handed over nothing, so the upload step received an empty token,
    # fell back to a tokenless upload, reported success, and Codecov stored
    # nothing. The badge has read "unknown" ever since, while a green tick
    # said the coverage had been uploaded.
    #
    # `secrets: inherit` would fix it and also hand AUR_KEY,
    # HOMEBREW_TAP_TOKEN and SCORECARD_TOKEN to a workflow in another
    # repository, none of which it asks for or needs. It declares exactly one
    # secret, so exactly one is passed.
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # The reusable go-ci workflow above does not run the race detector or
  # randomise test order, and a 100%-coverage suite turned out to be
  # order-dependent: `go test -shuffle` failed on 3 of 4 seeds because one test
  # left cobra's help flag set on the package-level rootCmd, so every later test
  # short-circuited into help output and asserted nothing. Both flags are gates
  # here so that class of defect cannot come back silently.
  hardened-tests:
    name: Race & Shuffled Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No actions/setup-go: the runner ships a toolchain, and GOTOOLCHAIN=auto
      # honours the `go` directive in go.mod, so the version is pinned by go.mod
      # rather than by a workflow input that can drift from it. This also keeps
      # the job out of the critical path of a codeload rate-limit on the action
      # tarball, which failed these jobs during "Set up job" — before any step
      # ran — repeatedly on 2026-08-17.
      - name: Test with race detector and randomised order
        env:
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          go version
          go test -race -shuffle=on ./...
      # Benchmarks are compiled and executed, briefly, on every run. Not to
      # measure anything — runner timings are far too noisy for that — but so
      # a benchmark cannot rot into something that no longer builds or panics
      # on an empty fixture, which is what happens to benchmarks nobody runs.
      - name: Smoke-run benchmarks
        env:
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          go test -run '^$' -bench . -benchtime 1x ./...

      # Fixed seeds alongside -shuffle=on: a random seed catches ordering bugs
      # eventually, named seeds catch them reproducibly.
      - name: Test with fixed shuffle seeds
        env:
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          for seed in 1 2 3; do
            echo "::group::shuffle seed ${seed}"
            go test -count=1 -shuffle="${seed}" ./...
            echo "::endgroup::"
          done

  # golangci-lint, which the Makefile has run since the beginning and CI
  # never did.
  #
  # The reusable go-ci workflow above runs `go vet` and `staticcheck` — two of
  # the four linters .golangci.yml enables. errcheck and gosec were therefore
  # enforced only on whichever laptop happened to run `make lint`, which is not
  # a gate; it is a habit, and habits do not fail pull requests.
  #
  # This surfaced when Go Report Card was sunset. Its own farewell points to
  # golangci-lint (https://golangci-lint.run) as the successor, the README now
  # says that is what corral uses, and a claim in the README has to be backed
  # by something that actually runs. This job is that something.
  #
  # The version is pinned rather than floating: a linter that gains a check
  # overnight turns an unrelated pull request red, and the fix belongs in its
  # own commit where it can be read.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No actions/setup-go, for the reason given in docs-check below: the
      # runner ships a toolchain and GOTOOLCHAIN=auto honours go.mod, so the
      # version is pinned by go.mod rather than by a workflow input that can
      # drift away from it.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOTOOLCHAIN: auto
        with:
          version: v2.13.2
          args: ./...

  vulncheck:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No actions/setup-go: the runner ships a toolchain, and GOTOOLCHAIN=auto
      # honours the `go` directive in go.mod, so the version is pinned by go.mod
      # rather than by a workflow input that can drift from it. This also keeps
      # the job out of the critical path of a codeload rate-limit on the action
      # tarball, which failed these jobs during "Set up job" — before any step
      # ran — repeatedly on 2026-08-17.
      # govulncheck reports only vulnerabilities that are actually reachable
      # from this module's call graph, including ones in the standard library —
      # which is what a pinned toolchain quietly accumulates between releases.
      - name: Run govulncheck
        env:
          GOTOOLCHAIN: auto
          # Pin the install location rather than inferring it. actions/setup-go
          # used to put the Go bin dir on PATH; without it `govulncheck` was
          # installed but not found and the step failed with exit 127 instead of
          # reporting vulnerabilities. Inferring $(go env GOPATH)/bin is not
          # reliable either, because `go install` honours GOBIN when it is set.
          GOBIN: ${{ github.workspace }}/.gobin
        run: |
          set -euo pipefail
          go version
          # govulncheck must be *built* with a toolchain at least as new as the
          # module it analyses. `go install pkg@latest` resolves in its own
          # module context, so it picks the oldest toolchain satisfying x/vuln's
          # own go directive — go1.25.13 — and a scanner built with 1.25 cannot
          # load a module that requires 1.26:
          #   "package requires newer Go version go1.26 (application built with go1.25)"
          # Derive the toolchain from go.mod so this stays a single source of
          # truth and cannot drift the way a hardcoded version would.
          goversion="$(go list -m -f '{{.GoVersion}}')"
          echo "building govulncheck with go${goversion}"
          # Pinned, not @latest. Scorecard's Pinned-Dependencies check flags an
          # unpinned `go install` because whatever @latest resolves to at run
          # time then executes in CI — and this repo pins every action by SHA, so
          # leaving one unpinned tool in the chain is inconsistent. Pinning the
          # scanner does not stale the results: the vulnerability database is
          # fetched from vuln.go.dev at run time, not baked into the binary.
          GOTOOLCHAIN="go${goversion}" go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "${GOBIN}/govulncheck" -version
          "${GOBIN}/govulncheck" ./...

  # The Unix install contract is the thing packagers rely on and the thing
  # nothing else exercises: `make install` can rot into a broken tree and
  # every other job stays green. Staging it on a clean runner is the only
  # check that catches it.
  install-contract:
    name: Install Contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Stage an install and assert the tree
        env:
          GOTOOLCHAIN: auto
        run: make install-smoke

      # Manpages are generated from the cobra command tree, so a page that
      # fails to render means the tree changed in a way the generator cannot
      # express. groff -ww surfaces that; without it the break only shows up
      # in a released tarball.
      - name: Manpages render without warnings
        env:
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq groff
          make docs
          for page in build/man/*.1; do
            echo "checking ${page}"
            groff -man -Tutf8 -ww "${page}" >/dev/null 2>groff.err
            if [ -s groff.err ]; then
              echo "::error::${page} produced groff warnings"; cat groff.err; exit 1
            fi
          done
          echo "all manpages render cleanly"

  # The release config is validated with the same goreleaser the release
  # runs, at the same pinned version.
  #
  # A duplicate `flags:` key sat in .goreleaser.yaml across two merges. The
  # local goreleaser (2.17.1) accepted it and `goreleaser check` passed;
  # the version the action pins (2.18.0) rejects it outright, so the first
  # dry run died at "Run GoReleaser" with a yaml unmarshal error. Checking
  # the config on every push, with the version that will actually build the
  # release, is what turns that into a pull-request failure instead of a
  # tag-push failure.
  release-config:
    name: Release Config
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate .goreleaser.yaml
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check

  docs-check:
    name: Documentation Coverage Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Deliberately no actions/setup-go here.
      #
      # This job needs nothing from setup-go but a toolchain, and the runner
      # already ships one. Depending on the action meant the job could fail
      # during "Set up job" — before any step ran — whenever codeload
      # rate-limited the tarball download, which is exactly what happened
      # repeatedly on 2026-08-17 (429, then 503, then 429 across three
      # attempts and two manual re-runs).
      #
      # GOTOOLCHAIN=auto is Go's default and honours the `go` directive in
      # go.mod, so the version used here is pinned by go.mod rather than by a
      # workflow input that can silently drift away from it. That is stricter
      # than what this job had before, not looser.
      - name: Enforce 100% Doc Coverage
        env:
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          go version
          go run scripts/doc_coverage.go

      # The documentation theme's colour pairs, at WCAG AAA.
      #
      # scripts/build-docs.sh runs this too, but that script only runs on a
      # push to main — by which point a colour that fails contrast is already
      # published. A palette change arrives in a pull request, so the check
      # belongs here as well.
      - name: Theme contrast is AAA
        run: python3 scripts/contrast.py

      # Everything a tag push would otherwise be the first to try.
      #
      # Two releases in a row published their artefacts and then failed — the
      # Homebrew tap refused a push in v0.0.33, the MCP registry rejected
      # server.json in v0.0.35 — and the existing dry run could not have
      # caught either, because a dry run skips publishing and publishing is
      # where both failed.
      #
      # This validates server.json against the registry's own schema rather
      # than a copied list of limits, and asserts that no publisher can take
      # the release down with it. Both failures are in its regression set.
      - name: Release preflight
        run: |
          set -euo pipefail
          # --require-hashes, because a preflight that installs whatever PyPI
          # serves today is a supply-chain hole in the very step whose job is
          # to be trustworthy. Scorecard's Pinned-Dependencies check flagged
          # the unpinned form on the pull request that added this, which is
          # the check doing exactly what it is for.
          python3 -m pip install --quiet --disable-pip-version-check \
            --require-hashes -r scripts/requirements-preflight.txt
          python3 scripts/release_preflight.py

      # REUSE-style licence coverage over the whole tree, not just the files
      # someone remembered. Twenty-one workflow and config files had drifted
      # uncovered before this became a gate.
      - name: Every source file carries an SPDX header
        env:
          GOTOOLCHAIN: auto
        run: go run scripts/spdx_sweep.go -check

      # SBOM.md and server.json are hand-maintained and have both drifted
      # silently before — SBOM.md carried go-github v74 for six releases after
      # go.mod moved to v90, and server.json's version sat at 0.0.13 through
      # five releases. Neither is where the change happens, so review does not
      # catch it. This does.
      - name: Check manifests against go.mod and CHANGELOG
        env:
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          go run scripts/manifest_check.go

      # Coverage percentages, package counts, benchmark presence and example
      # references all go stale silently: nothing fails when a number in
      # prose stops matching the code. .bestpractices.json is an OpenSSF
      # submission and claimed 90.2% coverage "as of v0.0.11" through
      # twenty releases, by which point it was 100% across twelve packages.
      - name: Claims about the project are still true
        env:
          GOTOOLCHAIN: auto
        run: go run scripts/claims_check.go

      # pkg/ exists so a packager can find the recipe for a format without
      # reading the release pipeline, and that only holds while it is
      # complete. A directory of prose cannot notice that a new format
      # shipped last month, which is how this kind of directory rots, so
      # the pipeline is the source of truth and this compares against it.
      - name: pkg/ documents every distribution format
        env:
          GOTOOLCHAIN: auto
        run: go run scripts/pkg_check.go

      # The documentation site is only built by the Deploy Docs workflow, on
      # push to main — so a change that breaks the generator was invisible
      # until after it merged. Build it here too, and assert it covers every
      # package `go list` reports: the package list used to be hardcoded, and
      # internal/diag shipped in v0.0.26 without ever reaching the site.
      # The site is built by ssg through the vendored Lucid theme, so the
      # generator now emits Markdown rather than a whole HTML page and these
      # assertions read that instead. The build runs here as well as in the
      # deploy workflow, because a change that breaks it was previously
      # invisible until after it had merged.
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@75b4bfae1b2c753a6806bbce6e6cb89b602de33c # v1.22.0

      - name: Install ssg
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .github/ssg-version)"
          cargo binstall --no-confirm "ssg@${version}"

      - name: Build the documentation site
        env:
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          # Builds, copies assets, adds heading ids, and fails on a dangling
          # in-page fragment.
          bash scripts/build-docs.sh

          ref="docs-site/content/reference.md"
          missing=0
          # The package list was hardcoded once and internal/diag shipped in
          # v0.0.26 without ever reaching the site, so this compares against
          # what `go list` actually reports.
          for pkg in $(go list ./... | sed 's|github.com/sebastienrousseau/corralctl/||'); do
            # `--` matters: the pattern starts with a hyphen, and without
            # it grep reads it as an option and reports every package
            # missing, which is a gate that fails whatever you do.
            if ! grep -qF -- "- [${pkg}](#" "${ref}"; then
              echo "::error::${pkg} is missing from the generated documentation site"
              missing=1
            fi
          done
          # Unexported declarations are implementation detail; 173 of them
          # were published once.
          if grep -qE '^#### [a-z_]' "${ref}"; then
            echo "::error::the site is publishing unexported declarations"
            missing=1
          fi
          exit "${missing}"

      # The examples carry `//go:build ignore`, so `go build ./...` skips them
      # and nothing else compiles them either. They could reference a renamed
      # function indefinitely without a single job noticing.
      - name: Compile the examples
        env:
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          go run scripts/example_check.go
