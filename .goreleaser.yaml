version: 2

project_name: corralctl

# Replace an existing GitHub release on re-run, so a release can be retried
# after adding the Homebrew/AUR publishing secrets.
release:
  mode: replace
  # The grouped commit log below answers "what changed"; this answers "how do
  # I trust it", which is the question a release page should not make someone
  # go looking for.
  header: |
    Full notes, including the reasoning behind each change, are in
    [CHANGELOG.md](https://github.com/sebastienrousseau/corralctl/blob/main/CHANGELOG.md).

    **Verify what you downloaded:**

    ```bash
    gh attestation verify <asset> --owner sebastienrousseau
    ```

    Every asset is covered by `checksums.txt`, which is signed
    (`checksums.txt.sigstore.json`), and SLSA build provenance ships as
    `checksums.txt.intoto.jsonl`.

# Manpages and shell completions are rendered from the cobra command tree
# before anything is packaged. Generated, never committed: a checked-in .1
# drifts from `--help` the first time a flag changes, and nothing catches it.
before:
  hooks:
    - go run scripts/gen_docs.go build

builds:
  - env:
      - CGO_ENABLED=0
    # -trimpath removes the build machine's absolute paths from the
    # binary. Without it a release shipped 1,142 strings rooted at the
    # maintainer's home directory, and the build was not reproducible —
    # which sits oddly beside SLSA provenance, since reproducibility is
    # what lets a third party check provenance rather than trust it.
    flags:
      - -trimpath
    # Pin the archive/binary timestamp to the commit so two builds of the
    # same commit are byte-identical.
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    main: ./cmd/corralctl
    binary: corralctl
    ldflags:
      - -s -w
        -X github.com/sebastienrousseau/corralctl/cmd.Version={{.Version}}
        -X github.com/sebastienrousseau/corralctl/internal/tui.Version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - SECURITY.md
      - src: build/man/*.1
        dst: man
      - src: build/completions/*
        dst: completions
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}

# 4. GitHub Container Registry (Docker/OCI) for the MCP Registry entry.
# One image per arch; docker_manifests below fans them into a multi-arch
# manifest under both the version and :latest tags. The io.modelcontextprotocol.
# server.name label is the ownership marker mcp-publisher validates against
# server.json before accepting the registry entry.
dockers:
  - image_templates:
      - "ghcr.io/sebastienrousseau/corralctl:{{ .Version }}-amd64"
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - --platform=linux/amd64
      - --label=org.opencontainers.image.title={{ .ProjectName }}
      - --label=org.opencontainers.image.description=corralctl local index for AI coding agents (Model Context Protocol)
      - --label=org.opencontainers.image.url=https://github.com/sebastienrousseau/corralctl
      - --label=org.opencontainers.image.source=https://github.com/sebastienrousseau/corralctl
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.created={{ .Date }}
      - --label=org.opencontainers.image.licenses=GPL-3.0
      - --label=io.modelcontextprotocol.server.name=io.github.sebastienrousseau/corralctl
  - image_templates:
      - "ghcr.io/sebastienrousseau/corralctl:{{ .Version }}-arm64"
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - --platform=linux/arm64
      - --label=org.opencontainers.image.title={{ .ProjectName }}
      - --label=org.opencontainers.image.description=corralctl local index for AI coding agents (Model Context Protocol)
      - --label=org.opencontainers.image.url=https://github.com/sebastienrousseau/corralctl
      - --label=org.opencontainers.image.source=https://github.com/sebastienrousseau/corralctl
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.created={{ .Date }}
      - --label=org.opencontainers.image.licenses=GPL-3.0
      - --label=io.modelcontextprotocol.server.name=io.github.sebastienrousseau/corralctl

docker_manifests:
  - name_template: "ghcr.io/sebastienrousseau/corralctl:{{ .Version }}"
    image_templates:
      - "ghcr.io/sebastienrousseau/corralctl:{{ .Version }}-amd64"
      - "ghcr.io/sebastienrousseau/corralctl:{{ .Version }}-arm64"
  - name_template: "ghcr.io/sebastienrousseau/corralctl:latest"
    image_templates:
      - "ghcr.io/sebastienrousseau/corralctl:{{ .Version }}-amd64"
      - "ghcr.io/sebastienrousseau/corralctl:{{ .Version }}-arm64"

# Keyless cosign signing of each per-arch image and both manifest tags.
# Uses the sigstore OIDC identity produced by the GitHub Actions runner
# (no long-lived signing key exists). Signatures are pushed alongside
# the image to ghcr.io; users verify with:
#   cosign verify \
#     --certificate-identity-regexp='https://github.com/sebastienrousseau/corralctl/.github/workflows/release.yml@refs/tags/.*' \
#     --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
#     ghcr.io/sebastienrousseau/corralctl:0.0.11
docker_signs:
  # `artifacts: all` covers both the per-arch images produced by the
  # dockers: block AND the multi-arch tags emitted by docker_manifests:
  # in one signing entry — goreleaser errored on two entries sharing
  # the same default ID (v2 semantics).
  - id: cosign-oidc
    cmd: cosign
    args:
      - sign
      - --yes
      - '${artifact}'
    artifacts: all
    output: true

# 1. Native Linux Packages (Debian, Ubuntu, WSL, Fedora, RHEL, openSUSE)
nfpms:
  - id: corralctl-packages
    file_name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    homepage: "https://github.com/sebastienrousseau/corralctl"
    maintainer: "Sebastien Rousseau <sebastian.rousseau@gmail.com>"
    description: "Clone and organise repositories from GitHub, GitLab, Gitea, Forgejo, Codeberg and Bitbucket by visibility and language, then let your AI coding agent search across all of them at once, straight from disk."
    license: "GPL-3.0"
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    contents:
      - src: build/man/*.1
        dst: /usr/share/man/man1
        file_info: {mode: 0644}
      - src: build/completions/corralctl.bash
        dst: /usr/share/bash-completion/completions/corralctl
        file_info: {mode: 0644}
      - src: build/completions/corralctl.zsh
        dst: /usr/share/zsh/site-functions/_corralctl
        file_info: {mode: 0644}
      - src: build/completions/corralctl.fish
        dst: /usr/share/fish/vendor_completions.d/corralctl.fish
        file_info: {mode: 0644}
      - src: LICENSE
        dst: /usr/share/doc/corralctl/LICENSE
        file_info: {mode: 0644}

# 2. macOS & Linux Homebrew Tap
# Homebrew cask. goreleaser deprecated `brews:` in favour of casks, so a cask
# is the supported path — but a cask is a macOS-only mechanism, and `brew
# install` on Linux will refuse it. The README used to advertise
# "Homebrew (macOS / Linux)"; it now says macOS, and Linux users are pointed at
# the .deb/.rpm packages and tarballs this same release publishes.
homebrew_casks:
  - name: corralctl
    repository:
      owner: sebastienrousseau
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
      # Generated here, published by the `brew` job in release.yml.
      #
      # This has now been wrong in both directions. It was `pull_request:
      # enabled`, which opened a PR every release that waited for a human —
      # seven accumulated while the tap served v0.0.25 through v0.0.32.
      # v0.0.33 changed it to commit straight to `main`, which cannot work:
      # the tap protects `main` with enforce_admins, so the push returned
      # `409 Changes must be made through a pull request` and *failed the
      # release* — after the artefacts were published but before their SLSA
      # provenance, and before the MCP registry entry. A tap that a token
      # cannot write to cost that release its attestations.
      #
      # So the cask follows the AUR: generated by goreleaser from the real
      # checksums, uploaded nowhere from inside this job, and published
      # afterwards by a job that cannot fail the release. The same principle
      # already written above `aurs:` — an unreachable package host must not
      # cost a release its provenance — applies here and was learned twice.
    skip_upload: true
    binaries:
      - corralctl
    homepage: "https://github.com/sebastienrousseau/corralctl"
    description: "Clone and organise repositories from GitHub, GitLab, Gitea, Forgejo, Codeberg and Bitbucket by visibility and language, then let your AI coding agent search across all of them at once, straight from disk."

# 3. Arch Linux / CachyOS (AUR)
aurs:
  - name: corralctl-bin
    homepage: "https://github.com/sebastienrousseau/corralctl"
    description: "Clone and organise repositories from GitHub, GitLab, Gitea, Forgejo, Codeberg and Bitbucket by visibility and language, then let your AI coding agent search across all of them at once, straight from disk."
    maintainers:
      - "Sebastien Rousseau"
    license: "GPL-3.0"
    private_key: '{{ .Env.AUR_KEY }}'
    git_url: 'ssh://aur@aur.archlinux.org/corralctl-bin.git'
    # AUR availability must not block release artifacts and attestations:
    # aur.archlinux.org going away for an hour should not cost a release
    # its provenance. So the upload is skipped here and performed by a
    # separate, non-blocking job in the release workflow, which runs after
    # the artefacts and attestations are safely published.
    #
    # The previous arrangement left it "generated in dist for manual
    # publishing", and manual publishing happened once: the AUR package
    # sat at 0.0.13 while the project shipped 0.0.32.
    skip_upload: true
    package: |-
      # bin
      install -Dm755 "./corralctl" "${pkgdir}/usr/bin/corralctl"
      # license
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/corralctl/LICENSE"

checksum:
  name_template: 'checksums.txt'

# A machine-readable SBOM per archive. SBOM.md was a hand-maintained markdown
# table and had already drifted — it omitted the MCP SDK powering the whole
# server, and golang.org/x/sys — while
# SECURITY.md pointed at it as the full bill of materials. Generated beats
# curated. Also scored: OpenSSF Scorecard awards points for having an SBOM and
# more for publishing it as a release artifact.
sboms:
  - id: archive
    artifacts: archive
    documents:
      - '{{ .ArtifactName }}.spdx.sbom.json'

# Keyless cosign signature over checksums.txt, attached to the release as an
# asset.
#
# corral already produced SLSA provenance and signed its OCI images, but
# provenance lives in GitHub's attestation store and image signatures are not
# release assets, so a consumer who downloads a tarball had nothing next to it
# to verify against.
#
# Emits a Sigstore bundle rather than the older separate .sig/.pem pair.
# cosign v3 — which sigstore/cosign-installer installs by default — removed
# --output-signature and --output-certificate from sign-blob entirely; only
# --bundle remains, and passing the old flags fails with
# "must specify --bundle with --new-bundle-format". The .sigstore.json
# extension is Sigstore's documented bundle name.
#
# Verify with:
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-identity-regexp 'https://github.com/sebastienrousseau/corralctl/.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     checksums.txt
signs:
  - cmd: cosign
    signature: '${artifact}.sigstore.json'
    args:
      - sign-blob
      - '--bundle=${signature}'
      - '${artifact}'
      - '--yes'
    artifacts: checksum
    output: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# Release notes must be a descriptive log of functional and security
# modifications, not a list of merge-commit SHAs. Merge commits carry no
# information a reader wants — they name a branch — so they are filtered out
# and the remaining commits are grouped by what they did.
changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^feat(\([^)]*\))?!?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\([^)]*\))?!?:'
      order: 1
    - title: Security and dependencies
      regexp: '^(sec|deps|chore\(deps\)|chore\(docker\)|chore\(actions\))'
      order: 2
    - title: Other
      order: 99
  filters:
    exclude:
      - '^Merge pull request'
      - '^Merge branch'
      - '^docs:'
      - '^test:'
      - '^chore: '
